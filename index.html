<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VN Supplier Benchmark</title>
<meta name="theme-color" content="#C33D27" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="VN Benchmark" />
<link rel="icon" type="image/png" href="alpha-a.png" />
<link rel="apple-touch-icon" href="alpha-a.png" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="vendor/leaflet.css" />
<style>
  html { -webkit-text-size-adjust: 100%; }
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e8eef6;
    --blue: #3b82f6;
    --blue-deep: #2563eb;
    --blue-soft: #eff6ff;
    --green: #10b981;
    --green-soft: #ecfdf5;
    --amber: #f59e0b;
    --amber-soft: #fffbeb;
    --rose: #f43f5e;
    --rose-soft: #fff1f2;
    --violet: #8b5cf6;
    --violet-soft: #f5f3ff;
    --sky: #0ea5e9;
    --sidebar: 248px;
    --top: 56px;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13.5px/1.45 "Segoe UI", Inter, system-ui, sans-serif; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  .menu-btn { display: none; }
  .scrim { display: none; }
  a { color: var(--blue-deep); text-decoration: none; }

  .app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100%; }
  .side {
    background: #fff; border-right: 1px solid var(--line); padding: 18px 14px 16px;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .mark {
    width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex: 0 0 36px;
    background: #C33D27;
  }
  .mark img { width: 36px; height: 36px; display: block; }
  .brand b { display: block; font-size: 13.5px; }
  .brand span { color: var(--muted); font-size: 11px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    text-align: left; border: 0; background: transparent; color: #334155;
    padding: 8px 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px;
  }
  .nav button:hover { background: #f8fafc; }
  .nav button.active { background: var(--blue-soft); color: var(--blue-deep); font-weight: 650; }
  .ico { width: 18px; height: 18px; display: inline-flex; flex: 0 0 18px; color: inherit; }
  .ico svg, .ico-tile svg, .nav-ico svg, .act-ico svg { width: 18px; height: 18px; display: block; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico-tile svg { width: 18px; height: 18px; }
  .nav-ico {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    flex: 0 0 28px; color: #fff;
  }
  .nav-ico svg { width: 15px; height: 15px; stroke: #fff; }
  .nav-ico.blue { background: #3b82f6; }
  .nav-ico.violet { background: #8b5cf6; }
  .nav-ico.green { background: #10b981; }
  .nav-ico.sky { background: #0ea5e9; }
  .nav-ico.amber { background: #f59e0b; }
  .nav-ico.rose { background: #f43f5e; }
  .nav-ico.pink { background: #ec4899; }
  .nav .sec { margin: 14px 8px 6px; font-size: 11px; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; }
  .kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .ico-tile {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 36px;
  }
  .ico-tile.blue { background: var(--blue-soft); color: var(--blue-deep); }
  .ico-tile.green { background: var(--green-soft); color: #059669; }
  .ico-tile.rose { background: var(--rose-soft); color: var(--rose); }
  .ico-tile.violet { background: var(--violet-soft); color: #6d28d9; }
  .ico-tile.amber { background: var(--amber-soft); color: #d97706; }
  .btn { display: inline-flex; align-items: center; gap: 7px; }
  .act {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; min-width: 92px; padding: 8px 10px 9px;
    border: 1px solid var(--line); background: #fff; border-radius: 12px;
    color: #334155; font-size: 11.5px; line-height: 1.2;
  }
  .act:hover { border-color: #cbd5e1; background: #fafbff; }
  .act-ico {
    width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  }
  .act-ico svg { width: 16px; height: 16px; stroke: #fff; }
  .act-ico.violet { background: #8b5cf6; }
  .act-ico.blue { background: #3b82f6; }
  .act-ico.green { background: #10b981; }
  .act-ico.amber { background: #f59e0b; }
  .search .ico { color: #94a3b8; }
  .chip-user .ico { color: #94a3b8; width: 16px; height: 16px; }
  .chip-user .ico svg { width: 16px; height: 16px; }
  .h1-row { display: flex; align-items: center; gap: 10px; }
  .h1-row .ico-tile { width: 40px; height: 40px; border-radius: 12px; }
  .h1-row .ico-tile svg { width: 20px; height: 20px; }
  .card h2 .ico { color: var(--blue-deep); margin-right: 2px; }

  .main { min-width: 0; }
  .top {
    height: var(--top); background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 22px; position: sticky; top: 0; z-index: 5;
  }
  .search {
    flex: 1; max-width: 560px; display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
  }
  .search input { border: 0; background: transparent; outline: none; width: 100%; }
  .chip-user {
    margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px;
  }
  .dot { width: 28px; height: 28px; border-radius: 50%; background: #dbeafe; color: var(--blue-deep);
    display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .top-tools { display: flex; align-items: center; gap: 8px; }
  .bell, .lang-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 12px; color: #fff; border: 0; cursor: pointer;
    flex: 0 0 auto; box-shadow: 0 1px 2px rgba(15,23,42,.08);
  }
  .bell {
    position: relative; background: #EAB308; color: #BE123C;
  }
  .bell svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .bell .dot {
    position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; border-radius: 50%;
    background: #BE123C; border: 2px solid #EAB308; display: none;
  }
  .bell.has-alert .dot { display: block; }
  .bell-pop {
    display: none; position: absolute; right: 22px; top: 58px; width: 280px; z-index: 20;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 14px 16px;
  }
  .bell-pop.on { display: block; }
  .bell-pop strong { display: block; font-size: 13.5px; margin-bottom: 4px; }
  .bell-pop p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .lang-btn {
    background: #7C3AED; font-size: 13px; letter-spacing: .04em; gap: 0;
    flex-direction: column; line-height: 1.05; padding: 4px 0;
  }
  .lang-btn small { font-size: 9px; font-weight: 700; color: #EDE9FE; }
  .lang-btn b { font-size: 13px; font-weight: 800; }
  html[lang="zh-CN"] .lang-btn b { letter-spacing: 0; }

  .page { padding: 22px 24px 48px; }
  .head { display: flex; align-items: flex-start; justify-content: flex-start; gap: 8px; margin-bottom: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .act-ico.sky { background: #0ea5e9; }
  .act-ico.rose { background: #f43f5e; }
  .act-ico.pink { background: #ec4899; }
  .act-ico.slate { background: #64748b; }
  .btn {
    border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; color: #334155;
  }
  .btn:hover { border-color: #cbd5e1; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-deep); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .filters select {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 10px; color: #334155; font-size: 12px; max-width: 168px;
  }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 16px 14px 18px; border-left: 4px solid var(--blue); min-height: 92px;
  }
  .kpi.green { border-left-color: var(--green); }
  .kpi.amber { border-left-color: var(--amber); }
  .kpi.violet { border-left-color: var(--violet); }
  .kpi.rose { border-left-color: var(--rose); }
  .kpi .lab { color: var(--muted); font-size: 12px; }
  .kpi b { display: block; font-size: 26px; letter-spacing: -.03em; margin: 4px 0 2px; }
  .kpi .delta { font-size: 12px; color: var(--muted); }
  .kpi .delta.up { color: var(--green); }
  .kpi .delta.down { color: var(--rose); }

  .layout { display: grid; grid-template-columns: 1.7fr .9fr; gap: 14px; }
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .card h2 {
    margin: 0; padding: 14px 16px 10px; font-size: 14.5px; display: flex; align-items: baseline; gap: 8px;
  }
  .card h2 span { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .card .pad { padding: 0 16px 16px; }
  .tabs { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
  .tabs button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; color: #475569; font-size: 12px;
  }
  .tabs button.on { background: var(--blue-soft); border-color: #bfdbfe; color: var(--blue-deep); font-weight: 650; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; color: #94a3b8; font-weight: 600; padding: 8px 10px;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  .po { font-weight: 650; }
  .sub { color: var(--muted); font-size: 11.5px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px;
    border-radius: 999px; background: #f1f5f9; color: #475569; white-space: nowrap;
  }
  .tag.easy { background: var(--green-soft); color: #047857; }
  .tag.med { background: var(--amber-soft); color: #b45309; }
  .tag.hard { background: #ffedd5; color: #c2410c; }
  .tag.vhard { background: var(--rose-soft); color: #be123c; }
  .tag.blue { background: var(--blue-soft); color: var(--blue-deep); }
  .tag.violet { background: var(--violet-soft); color: #6d28d9; }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 14px; color: var(--muted); font-size: 12px; }
  .pager .pages { display: flex; gap: 4px; }
  .pager button { min-width: 28px; height: 28px; border: 1px solid var(--line); background: #fff; border-radius: 8px; }
  .pager button.on { background: var(--blue); border-color: var(--blue); color: #fff; }

  .rail { display: flex; flex-direction: column; gap: 14px; }
  .donut-wrap { display: flex; align-items: center; gap: 14px; }
  .donut { position: relative; width: 148px; height: 148px; flex: 0 0 148px; }
  .donut svg { width: 148px; height: 148px; transform: rotate(-90deg); filter: drop-shadow(0 4px 8px rgba(15,23,42,.08)); }
  .legend i { width: 10px; height: 10px; box-shadow: 0 0 0 2px #fff inset; }
  .donut .mid {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; transform: none;
  }
  .donut .mid b { display: block; font-size: 22px; letter-spacing: -.03em; }
  .donut .mid span { color: var(--muted); font-size: 11px; }
  .legend { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .legend li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; color: #334155; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .hbar { display: grid; grid-template-columns: 92px 1fr 52px; gap: 6px 8px; align-items: center; margin: 5px 0; font-size: 12px; }
  .hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #334155; }
  .hbar .track { height: 10px; background: #eef2f7; border-radius: 99px; overflow: hidden; }
  .hbar .track i { display: block; height: 100%; border-radius: 99px; }
  .hbar .n { text-align: right; color: #64748b; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .topic {
    display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; font-size: 12.5px;
  }
  .sw { width: 10px; height: 10px; border-radius: 3px; }

  .trend { height: 168px; }
  .trend svg { width: 100%; height: 168px; display: block; }
  .ho-chart { height: 240px; }
  .ho-chart svg { width: 100%; height: 240px; display: block; }
  .fty-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .fty-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #334155; }
  .fty-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .ho-table th { text-align: right; }
  .ho-table th:first-child, .ho-table td:first-child { text-align: left; }
  .ho-table td { text-align: right; font-variant-numeric: tabular-nums; }
  .ho-table tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
  .asia-map { height: 360px; border-radius: 12px; overflow: hidden; background: #c5d4e0; }
  .asia-map .leaflet-container { height: 360px; width: 100%; background: #c5d4e0; font: inherit; }
  .asia-map .leaflet-control-zoom a { color: #0f172a; }
  .map-label {
    background: transparent; border: 0; box-shadow: none; font: 700 11px/1 "Segoe UI", sans-serif;
    color: #4b5563; letter-spacing: .03em; white-space: nowrap; pointer-events: none;
  }
  .map-pin {
    background: transparent; border: 0; box-shadow: none; font: 800 10px/1 "Segoe UI", sans-serif;
    color: #5b21b6; white-space: nowrap; pointer-events: none;
  }
  .empty { padding: 24px; color: var(--muted); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .factory-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .factory-row strong { display: block; }
  .bar { height: 8px; background: #eef2f7; border-radius: 99px; overflow: hidden; min-width: 90px; }
  .bar > i { display: block; height: 100%; background: var(--blue); }
  .spark { display: flex; gap: 2px; align-items: flex-end; height: 22px; }
  .spark i { width: 4px; background: #93c5fd; border-radius: 1px; display: block; }
  .thumb {
    width: 44px; height: 44px; border-radius: 8px; object-fit: cover; display: block;
    background: #f1f5f9; border: 1px solid var(--line); cursor: zoom-in;
  }
  .thumb-empty {
    width: 44px; height: 44px; border-radius: 8px; background: #f8fafc;
    border: 1px dashed #dbe3ee; display: grid; place-items: center;
    color: #94a3b8; font-size: 10px;
  }
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 80;
    background: rgba(15,23,42,.62); place-items: center; padding: 24px;
  }
  .lightbox.on { display: grid; }
  .lightbox img {
    max-width: min(92vw, 720px); max-height: 86vh; border-radius: 12px;
    background: #fff; box-shadow: 0 12px 40px rgba(15,23,42,.28);
  }

  @media (max-width: 1180px) {
    .kpis, .layout, .grid2 { grid-template-columns: 1fr; }
    .app { grid-template-columns: 1fr; }
    .side {
      display: flex; position: fixed; left: 0; top: 0; z-index: 40;
      transform: translateX(-105%); transition: transform .2s ease;
      box-shadow: 8px 0 24px rgba(15,23,42,.12);
    }
    .app.nav-open .side { transform: translateX(0); }
    .scrim {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 30;
    }
    .app.nav-open .scrim { display: block; }
    .menu-btn {
      display: grid; place-items: center; width: 40px; height: 40px; border: 0;
      background: var(--blue-soft); color: var(--blue-deep); border-radius: 10px; flex: 0 0 40px;
    }
    .menu-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
    .top { padding: 0 12px; height: 52px; }
    .search { max-width: none; padding: 6px 10px; }
    .page { padding: 12px 12px 88px; }
    .act { min-width: 72px; padding: 6px 8px 7px; font-size: 11px; }
    .kpi { min-height: 0; padding: 10px 12px; }
    .kpi b { font-size: 20px; }
    .filters select { max-width: none; flex: 1 1 46%; font-size: 16px; padding: 8px 10px; }
    .chip-user { font-size: 0; gap: 6px; }
    .chip-user .dot { display: none; }
    table { font-size: 12px; }
    th, td { padding: 7px 6px; }
    .asia-map, .asia-map .leaflet-container { height: 280px; }
    .hbar { grid-template-columns: 72px 1fr 40px; }
  }
  @media (max-width: 640px) {
    .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
    .pager { flex-wrap: wrap; gap: 8px; }
    .actions { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="side">
    <div class="brand">
      <div class="mark"><img src="alpha-a.png" alt="Alpha" /></div>
      <div>
        <b>VN Supplier Benchmark</b>
        <span>Alpha Fashion</span>
      </div>
    </div>
    <nav class="nav">
      <button class="active" data-view="dash"><span class="nav-ico blue"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span> <span data-i18n="navDash">Dashboard</span></button>
      <button data-view="merch"><span class="nav-ico violet"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 10h8M8 14h5"/></svg></span> <span data-i18n="navMerch">Merchandiser</span></button>
      <button data-view="quality"><span class="nav-ico green"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 5 3.4 7.7 7 9 3.6-1.3 7-4 7-9V6l-7-3z"/><path d="m9 12 2 2 4-4"/></svg></span> <span data-i18n="navQuality">Quality library</span></button>
      <div class="sec" data-i18n="navBook">Book</div>
      <button data-view="orders"><span class="nav-ico sky"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span> <span data-i18n="navOrders">Order book</span></button>
      <button data-view="factories"><span class="nav-ico amber"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l5 3V10l5 3V5l6 3v13"/><path d="M9 21v-4M15 21v-4"/></svg></span> <span data-i18n="navFactories">Factories</span></button>
      <button data-view="customers"><span class="nav-ico rose"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> <span data-i18n="navCustomers">Customers</span></button>
    </nav>
  </aside>

  <div class="main">
    <div class="top">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="search">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input id="q" placeholder="Search PO, factory, customer, SKU…" />
      </div>
      <div class="chip-user">
        <div class="top-tools">
          <button type="button" class="bell" id="bellBtn" title="Merchandiser Alert" aria-label="Merchandiser Alert">

        var loc = FTY_LOC[o.factoryCode] || FTY_LOC[fk];
        ftyMap[fk] = {
          code: o.factoryCode, name: o.factoryName, country: loc ? "VN" : (o.country || "not reported"),
          province: loc ? loc.province : "",
          lat: loc ? loc.lat : null,
          lon: loc ? loc.lon : null,
          lines: 0, qty: 0, pos: {}, late: {}, cats: {}, customers: {}
        };
      }
      var f = ftyMap[fk];
      f.lines++; f.qty += o.qty || 0;
      if (o.category) f.cats[o.category] = (f.cats[o.category] || 0) + 1;
      if (o.customer) f.customers[o.customer] = true;
      if (o.po) {
        var pk = poKey(o);
        pos[pk] = true;
        f.pos[o.po] = true;
        if (o.customerDue && o.customerDue < AS) { latePo[pk] = true; f.late[o.po] = true; }
      }
    });
    return {
      lines: rows.length, qty: qty, pos: Object.keys(pos).length,
      late: Object.keys(latePo).length,
      factories: Object.keys(fty).length, customers: Object.keys(cust).length,
      newN: newN, repN: repN, bands: bands, cats: cats, months: months, hoMonth: hoMonth,
      distinctHo: Object.keys(allHo).length,
      inspect: inspect, qa: qa, ftyMap: ftyMap
    };
  }

  function donut(parts, centerLabel, centerSub) {
    var total = 0;
    parts.forEach(function (p) { total += p.n; });
    if (!total) return "<p class='empty'>No rows in this filter.</p>";
    var cx = 74, cy = 74, r = 50, ir = 28;
    var acc = 0;
    function polar(a, rad) {
      var rads = (a - 90) * Math.PI / 180;
      return [cx + rad * Math.cos(rads), cy + rad * Math.sin(rads)];
    }
    var slices = parts.filter(function (p) { return p.n > 0; }).map(function (p, i) {
      var frac = p.n / total;
      var start = acc * 360;
      acc += frac;
      var end = acc * 360;
      if (frac >= 0.999) {
        return "<circle cx='" + cx + "' cy='" + cy + "' r='" + r + "' fill='" + p.color + "'></circle>" +
          "<circle cx='" + cx + "' cy='" + cy + "' r='" + ir + "' fill='#fff'></circle>";
      }
      var large = frac > 0.5 ? 1 : 0;
      var p1 = polar(start, r), p2 = polar(end, r), p3 = polar(end, ir), p4 = polar(start, ir);
      var d = "M " + p1[0] + " " + p1[1] + " A " + r + " " + r + " 0 " + large + " 1 " + p2[0] + " " + p2[1] +
        " L " + p3[0] + " " + p3[1] + " A " + ir + " " + ir + " 0 " + large + " 0 " + p4[0] + " " + p4[1] + " Z";
      var gap = i ? " stroke='#fff' stroke-width='2'" : " stroke='#fff' stroke-width='1'";
      return "<path d='" + d + "' fill='" + p.color + "'" + gap + "></path>";
    }).join("");
    var legend = "<ul class='legend'>" + parts.map(function (p) {
      var pct = Math.round(100 * p.n / total);
      return "<li><span><i style='background:" + p.color + "'></i>" + esc(p.label) +
        "</span><b>" + pct + "% · " + fmt(p.n) + "</b></li>";
    }).join("") + "</ul>";
    return "<div class='donut-wrap'><div class='donut'><svg viewBox='0 0 148 148'>" +
      slices + "</svg><div class='mid'><b>" + esc(centerLabel) + "</b><span>" + esc(centerSub) +
      "</span></div></div>" + legend + "</div>";
  }
  function hbar(parts) {
    var max = 1;
    parts.forEach(function (p) { if (p.n > max) max = p.n; });
    if (!parts.length) return "<p class='empty'>No rows in this filter.</p>";
    return parts.map(function (p) {
      var w = Math.max(4, Math.round(100 * p.n / max));
      return "<div class='hbar' title='" + esc(p.label) + "'><span class='lab'>" + esc(p.label) +
        "</span><span class='track'><i style='width:" + w + "%;background:" + p.color + "'></i></span>" +
        "<span class='n'>" + fmt(p.n) + "</span></div>";
    }).join("");
  }

  function hoMonthBlock(hoMonth, distinctHo) {
    var enM = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var zhM = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    var names = lang === "zh" ? zhM : enM;
    var palette = ["#3b82f6","#8b5cf6","#10b981","#f59e0b","#f43f5e","#0ea5e9","#ec4899","#14b8a6","#eab308","#6366f1"];
    var year = "2026";
    var ftyKeys = {};
    var months = [];
    var max = 1;
    for (var i = 0; i < 12; i++) {
      var key = year + "-" + String(i + 1).padStart(2, "0");
      var rec = hoMonth[key];
      if (!rec || !Object.keys(rec.hos).length) continue;
      var ho = Object.keys(rec.hos).length;
      months.push({ key: key, label: names[i], ho: ho, qty: rec.qty || 0, fty: rec.fty || {} });
      if (ho > max) max = ho;
      Object.keys(rec.fty || {}).forEach(function (k) { ftyKeys[k] = rec.fty[k].name || k; });
    }
    var ftyList = Object.keys(ftyKeys).sort();
    var colorOf = {};
    ftyList.forEach(function (k, i) { colorOf[k] = palette[i % palette.length]; });
    var nM = Math.max(months.length, 1);
    var w = 520, h = 240, padL = 24, padR = 10, padT = 22, padB = 32;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var slot = innerW / nM;
    var barW = Math.min(48, slot * 0.58);
    var tops = [];
    var bars = months.map(function (m, i) {
      var x = padL + i * slot + (slot - barW) / 2;
      var y = padT + innerH;
      var stack = "";
      ftyList.forEach(function (k) {
        var f = m.fty[k];
        var n = f ? Object.keys(f.hos).length : 0;
        if (!n) return;
        var bh = (n / max) * innerH;
        y -= bh;
        var tip = (f.name || k) + " · " + n + " HO · " + fmt(f.qty) + " pcs";
        stack += "<rect x='" + x.toFixed(1) + "' y='" + y.toFixed(1) + "' width='" + barW.toFixed(1) +
          "' height='" + Math.max(1.4, bh).toFixed(1) + "' rx='3' fill='" + colorOf[k] +
          "'><title>" + esc(tip) + "</title></rect>";
      });
      var cx = x + barW / 2;
      var topY = padT + innerH - (m.ho / max) * innerH;
      tops.push({ x: cx, y: topY });
      return stack +
        (m.ho ? "<text x='" + cx + "' y='" + (topY - 8) + "' text-anchor='middle' font-size='11' font-weight='700' fill='#0f172a'>" + m.ho + "</text>" : "") +
        "<text x='" + cx + "' y='" + (h - 12) + "' text-anchor='middle' font-size='11' fill='#64748b'>" + m.label + "</text>";
    }).join("");
    var line = "";
    if (tops.length > 1) {
      var d = tops.map(function (p, i) { return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ");
      var last = tops[tops.length - 1];
      var prev = tops[tops.length - 2];
      var ang = Math.atan2(last.y - prev.y, last.x - prev.x);
      var ah = 8;
      var a1x = last.x - ah * Math.cos(ang - 0.5);
      var a1y = last.y - ah * Math.sin(ang - 0.5);
      var a2x = last.x - ah * Math.cos(ang + 0.5);
      var a2y = last.y - ah * Math.sin(ang + 0.5);
      line = "<path d='" + d + "' fill='none' stroke='#0f172a' stroke-width='2' stroke-linejoin='round'/>" +
        tops.map(function (p) {
          return "<circle cx='" + p.x.toFixed(1) + "' cy='" + p.y.toFixed(1) + "' r='3.2' fill='#fff' stroke='#0f172a' stroke-width='1.6'/>";
        }).join("") +
        "<path d='M" + last.x.toFixed(1) + " " + last.y.toFixed(1) + " L" + a1x.toFixed(1) + " " + a1y.toFixed(1) +
        " L" + a2x.toFixed(1) + " " + a2y.toFixed(1) + " Z' fill='#0f172a'/>";
    }
    var legend = "<div class='fty-legend'>" + ftyList.map(function (k) {
      return "<span><i style='background:" + colorOf[k] + "'></i>" + esc(k) + "</span>";
    }).join("") + "</div>";
    return "<div class='card'><h2>" + ico("trend") + " " + t("hoMonth") +
      " <span>" + fmt(distinctHo) + " HO</span></h2>" +
      "<div class='pad'><div class='ho-chart'><svg viewBox='0 0 " + w + " " + h + "'>" + bars + line +
      "</svg></div>" + legend + "</div></div>";
  }

  function spark(o) {
    var vals = [o.qty || 0];
    var h = Math.max(4, Math.min(22, Math.round(((o.qty || 0) % 17) + 6)));
    var bars = [8, 12, 7, h, 10].map(function (x, i) {
      var on = i === 3;
      return "<i style='height:" + x + "px;background:" + (on ? "#2563eb" : "#bfdbfe") + "'></i>";
    }).join("");
    return "<span class='spark' title='qty " + fmt(o.qty) + "'>" + bars + "</span>";
  }

        "<div class='delta down'>" + latePct + t("lateOf") + AS + "</div></div>" +

        "<div class='delta'>" + t("vnNote")(vn, unknown) + "</div></div>" +

  function tableCard(rows, s) {
    var list = rows.slice();
    if (tableTab === "late") list = list.filter(function (o) { return o.customerDue && o.customerDue < AS; });
    else if (tableTab === "new") list = list.filter(function (o) { return o.orderCategory === "New order"; });
    else if (tableTab === "repeat") list = list.filter(function (o) { return o.orderCategory === "Repeat order"; });
    else if (tableTab === "inspect") list = list.filter(function (o) { return inspectKind(o.inspect) !== "blank"; });
    list.sort(function (a, b) {
      var da = a.customerDue || "9999", db = b.customerDue || "9999";
      return da < db ? -1 : da > db ? 1 : 0;
    });
    var pages = Math.max(1, Math.ceil(list.length / pageSize));
    if (page > pages) page = pages;
    var start = (page - 1) * pageSize;
    var slice = list.slice(start, start + pageSize);
    var body = slice.map(function (o) {
      var band = delayBand(o.customerDue);
      var src = o.ho && HO_IMAGES[o.ho] ? HO_IMAGES[o.ho] : "";
      var pic = src
        ? "<img class='thumb' src='" + esc(src) + "' alt='" + esc(o.ho) + "' data-full='" + esc(src) + "' loading='lazy' />"
        : "<div class='thumb-empty'>—</div>";
      return "<tr>" +
        "<td>" + pic + "</td>" +
        "<td><div class='po'>" + esc(o.po || "–") + "</div><div class='sub'>" + esc(o.item || o.productName || "") + "</div></td>" +
        "<td>" + esc(shortFty(o)) + "<div class='sub'>" + esc(ftyPlace(o)) + "</div></td>" +
        "<td>" + esc(o.customer || "–") + "<div class='sub'>" + esc(o.endCustomer || "") + "</div></td>" +
        "<td>" + fmt(o.qty) + "</td>" +
        "<td><span class='" + band.cls + "'>" + esc(band.label) + "</span></td>" +
        "<td>" + t("notReported") + "</td>" +
        "<td>" + spark(o) + "</td>" +
        "<td>" + statusBits(o) + "</td>" +
        "</tr>";
    }).join("") || "<tr><td colspan='9' class='empty'>No rows in this filter.</td></tr>";

    var btns = "";
    for (var i = 1; i <= Math.min(pages, 8); i++) {
      btns += "<button data-page='" + i + "' class='" + (i === page ? "on" : "") + "'>" + i + "</button>";
    }
    if (pages > 8) btns += "<span style='padding:6px'>… " + pages + "</span>";

    return "<div class='card'>" +
      "<h2>" + ico("orders") + " " + t("orderBook") + " <span>" + fmt(list.length) + t("lines") + "</span></h2>" +
      "<div class='tabs'>" +
        "<button data-tab='all' class='" + (tableTab === "all" ? "on" : "") + "'>" + t("tabAll") + "</button>" +
        "<button data-tab='late' class='" + (tableTab === "late" ? "on" : "") + "'>" + t("tabLate") + "</button>" +
        "<button data-tab='new' class='" + (tableTab === "new" ? "on" : "") + "'>" + t("tabNew") + "</button>" +
        "<button data-tab='repeat' class='" + (tableTab === "repeat" ? "on" : "") + "'>" + t("tabRepeat") + "</button>" +
        "<button data-tab='inspect' class='" + (tableTab === "inspect" ? "on" : "") + "'>" + t("tabInspect") + "</button>" +
      "</div>" +
      "<div style='overflow:auto'>" +
      "<table><thead><tr>" +
        "<th>HO</th><th>PO / item</th><th>Factory</th><th>Customer</th><th>Qty</th>" +
        "<th>Delay</th><th>$</th><th>Trend</th><th>Status</th>" +
      "</tr></thead><tbody>" + body + "</tbody></table></div>" +
      "<div class='pager'><span>Showing " + (list.length ? (start + 1) : 0) + "–" +
        Math.min(start + pageSize, list.length) + " of " + fmt(list.length) + "</span>" +
        "<div class='pages'>" + btns + "</div></div></div>";
  }

  function dash(rows, s) {
    var bandParts = [
      { label: t("onTime"), n: s.bands.easy, color: "#22c55e" },

      { label: t("late821"), n: s.bands.hard, color: "#f97316" },

      { label: t("noDue"), n: s.bands.none, color: "#6366f1" }
    ];
    var custCount = {};
    rows.forEach(function (o) {
      var c = o.customer || "(blank)";
      custCount[c] = (custCount[c] || 0) + 1;
    });
    var custParts = Object.keys(custCount).sort(function (a, b) { return custCount[b] - custCount[a]; }).map(function (k, i) {
      var colors = ["#3b82f6", "#a855f7", "#10b981", "#f59e0b", "#ec4899", "#06b6d4", "#f43f5e", "#6366f1", "#14b8a6", "#eab308", "#0ea5e9"];
      return { label: k, n: custCount[k], color: colors[i % colors.length] };
    });
    var topics = Object.keys(s.ftyMap).sort(function (a, b) {

    }).map(function (k, i) {
      var colors = ["#3b82f6", "#10b981", "#8b5cf6", "#f59e0b", "#0ea5e9", "#f43f5e", "#6366f1", "#14b8a6", "#eab308", "#64748b"];
      var f = s.ftyMap[k];
      return "<span class='topic'><i class='sw' style='background:" + colors[i % colors.length] + "'></i>" +
        esc(f.code || k) + " · " + f.lines + "</span>";

    var score = s.pos ? Math.round(100 * s.late / s.pos) : 0;
    return kpiRow(s) +

          hbar(bandParts) +

        "</div></div>" +

          topics + "</div></div></div>" +

    if (window.ASIA) {
      L.geoJSON(window.ASIA, {
        style: { color: "#c4bdae", weight: 0.8, fillColor: "#e8e4d8", fillOpacity: 1 }
      }).addTo(asiaMap);
    }
    [
      { n: "China", lat: 36, lon: 103 },
      { n: "India", lat: 22, lon: 78 },
      { n: "Vietnam", lat: 15.5, lon: 109.5 },
      { n: "Thailand", lat: 16, lon: 101 },
      { n: "Cambodia", lat: 12.2, lon: 105 },
      { n: "Indonesia", lat: -2.5, lon: 113 },
      { n: "Philippines", lat: 12.5, lon: 122 },
      { n: "Malaysia", lat: 4, lon: 102 },
      { n: "Japan", lat: 37, lon: 138 },
      { n: "South Korea", lat: 36.5, lon: 128 },
      { n: "Bangladesh", lat: 24.2, lon: 90.2 },
      { n: "Myanmar", lat: 21, lon: 96 }
    ].forEach(function (l) {
      L.marker([l.lat, l.lon], {
        icon: L.divIcon({ className: "map-label", html: l.n, iconSize: [80, 14], iconAnchor: [40, 7] }),
        interactive: false
      }).addTo(asiaMap);
    });
    pins.forEach(function (f) {
      var r = Math.max(7, Math.min(16, 6 + Math.sqrt(f.lines)));
      L.circleMarker([f.lat, f.lon], {
        radius: r, color: "#fff", weight: 2, fillColor: "#7C3AED", fillOpacity: 0.88
      }).addTo(asiaMap).bindPopup(
        "<b>" + esc(f.code || "") + " · " + esc(f.name || "") + "</b><br>" +
        esc(f.province) + ", Vietnam<br>" + f.lines + " lines · " + Object.keys(f.pos).length + " PO"
      );
      L.marker([f.lat, f.lon], {
        icon: L.divIcon({
          className: "map-pin",
          html: esc(f.code || ""),
          iconSize: [48, 14],
          iconAnchor: [24, -10]
        }),
        interactive: false
      }).addTo(asiaMap);
    });
    if (pins.length) {
      var b = L.latLngBounds(pins.map(function (f) { return [f.lat, f.lon]; }));
      asiaMap.fitBounds(b.pad(0.35));
    } else {
      asiaMap.fitBounds([[-8, 70], [50, 145]], { padding: [12, 12] });
    }
    var bits = ["Vietnam · " + pins.length + " factory"];
    var prov = {};
    pins.forEach(function (f) { if (f.province) prov[f.province] = (prov[f.province] || 0) + 1; });
    bits.push(Object.keys(prov).length + " provinces");
    if (unknown.length) bits.push(unknown.length + " factory not pinned");
    var leg = document.getElementById("asiaMapLegend");
    if (leg) leg.textContent = bits.join(" · ") + " · + / − to zoom";
    setTimeout(function () { if (asiaMap) asiaMap.invalidateSize(); }, 80);
  }

  function factoriesView(rows, s) {
    return kpiRow(s) + asiaMapHtml() + "<div class='card' style='margin-top:14px'><h2>" + ico("factories") + " " + t("factories") + "</h2><div class='pad'>" +
      Object.keys(s.ftyMap).sort().map(function (k) {
        var f = s.ftyMap[k];
        var nPo = Object.keys(f.pos).length, nLate = Object.keys(f.late).length;
        return "<div class='factory-row'><div><strong>" + esc(f.code || k) + " · " + esc(f.name || "") +
          "</strong><div class='sub'>" + esc(f.province ? f.province + ", Vietnam" : f.country) + " · " + Object.keys(f.cats).join(" · ") +
          "</div></div><div class='sub'>" + nLate + "/" + nPo + " late PO · " + f.lines + " lines · " +
          fmt(f.qty) + " pcs · $ not reported</div></div>";
      }).join("") + "</div></div>";
  }

  function customersView(rows, s) {
    return merch(rows, s);
  }

  function setView(name) {
    view = name;
    page = 1;
    if (name !== "quality") tableTab = "all";
    document.querySelectorAll(".nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === name);
    });
    render();
  }

  function render() {
    var rows = filtered();
    var s = stats(rows);
    var html = "";
    if (view === "dash") html = dash(rows, s);
    else if (view === "merch") html = merch(rows, s);
    else if (view === "quality") html = quality(rows, s);
    else if (view === "orders") html = kpiRow(s) + tableCard(rows, s);
    else if (view === "factories") html = factoriesView(rows, s);
    else html = customersView(rows, s);
    document.getElementById("view").innerHTML = html;
    if (document.getElementById("asiaMap")) paintAsiaMap(s);
  }

  var appEl = document.getElementById("app");
  function closeNav() { appEl.classList.remove("nav-open"); }
  document.getElementById("menuBtn").addEventListener("click", function () {
    appEl.classList.toggle("nav-open");
  });
  document.getElementById("scrim").addEventListener("click", closeNav);
  document.querySelectorAll(".nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      setView(b.getAttribute("data-view"));
      closeNav();
    });
  });
  document.querySelectorAll("[data-jump]").forEach(function (b) {
    b.addEventListener("click", function () { setView(b.getAttribute("data-jump")); });
  });
  document.getElementById("btnLate").addEventListener("click", function () {
    document.getElementById("fDue").value = "custLate";
    tableTab = "late";
    setView("orders");
  });
  document.getElementById("btnMap").addEventListener("click", function () {
    setView("dash");
    setTimeout(function () {
      var m = document.getElementById("asiaMap");
      if (m) m.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 80);
  });
  ["fFty", "fCust", "fCat", "fDue", "fKind"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", function () { page = 1; render(); });
  });
  document.getElementById("q").addEventListener("input", function () { page = 1; render(); });
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  document.getElementById("view").addEventListener("click", function (e) {
    var img = e.target.closest && e.target.closest("img.thumb");
    if (img && img.getAttribute("data-full")) {
      lightboxImg.src = img.getAttribute("data-full");
      lightbox.classList.add("on");
      return;
    }
    var t = e.target.closest("[data-tab]");
    if (t) { tableTab = t.getAttribute("data-tab"); page = 1; render(); return; }
    var p = e.target.closest("[data-page]");
    if (p) { page = +p.getAttribute("data-page"); render(); }
  });
  document.getElementById("langBtn").addEventListener("click", function () {
    setLang(lang === "zh" ? "en" : "zh");
  });
  document.getElementById("bellBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("bellPop").classList.toggle("on");
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#bellPop") && !e.target.closest("#bellBtn")) {
      document.getElementById("bellPop").classList.remove("on");
    }
  });
  lightbox.addEventListener("click", function () {
    lightbox.classList.remove("on");
    lightboxImg.src = "";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      lightbox.classList.remove("on");
      lightboxImg.src = "";
    }
  });
  applyChrome();
  document.getElementById("btnExport").addEventListener("click", function () {
    var rows = filtered();
    var cols = ["po", "factoryCode", "factoryName", "customer", "endCustomer", "category", "item", "qty", "amount", "orderDate", "customerDue", "factoryDue", "orderCategory", "qa", "inspect", "country"];
    var lines = [cols.join(",")].concat(rows.map(function (o) {
      return cols.map(function (k) {
        var v = o[k];
        if (v == null) v = "";
        v = String(v).replace(/"/g, '""');
        return /[",\n]/.test(v) ? '"' + v + '"' : v;
      }).join(",");
    }));
    var blob = new Blob([lines.join("\n")], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "supplier-benchmark-9-24.csv";
    a.click();
  });

  setView("dash");
})();
</script>
</body>
</html>
