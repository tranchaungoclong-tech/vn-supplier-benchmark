<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VN Supplier Benchmark</title>
<meta name="theme-color" content="#C33D27" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="VN Benchmark" />
<link rel="icon" type="image/png" href="alpha-a.png?v=4" />
<link rel="apple-touch-icon" href="alpha-a.png?v=4" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="vendor/leaflet.css" />
<style>
  html { -webkit-text-size-adjust: 100%; }
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e8eef6;
    --blue: #3b82f6;
    --blue-deep: #2563eb;
    --blue-soft: #eff6ff;
    --green: #10b981;
    --green-soft: #ecfdf5;
    --amber: #f59e0b;
    --amber-soft: #fffbeb;
    --rose: #f43f5e;
    --rose-soft: #fff1f2;
    --violet: #8b5cf6;
    --violet-soft: #f5f3ff;
    --sky: #0ea5e9;
    --sidebar: 248px;
    --top: 56px;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13.5px/1.45 "Segoe UI", Inter, system-ui, sans-serif; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  .menu-btn { display: none; }
  .scrim { display: none; }
  a { color: var(--blue-deep); text-decoration: none; }

  .app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100%; }
  .side {
    background: #fff; border-right: 1px solid var(--line); padding: 18px 14px 16px;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .mark {
    width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex: 0 0 36px;
    background: #C33D27;
  }
  .mark img { width: 36px; height: 36px; display: block; }
  .brand b { display: block; font-size: 13.5px; }
  .brand span { color: var(--muted); font-size: 11px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    text-align: left; border: 0; background: transparent; color: #334155;
    padding: 8px 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px;
  }
  .nav button:hover { background: #f8fafc; }
  .nav button.active { background: var(--blue-soft); color: var(--blue-deep); font-weight: 650; }
  .nav .soon {
    margin-left: auto; font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 999px; padding: 2px 6px;
    white-space: nowrap;
  }
  .ico { width: 18px; height: 18px; display: inline-flex; flex: 0 0 18px; color: inherit; }
  .ico svg, .ico-tile svg, .nav-ico svg, .act-ico svg { width: 18px; height: 18px; display: block; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico svg path[fill-rule], .ico-tile svg path[fill-rule] { fill: currentColor; stroke: none; }
  .ico-tile svg { width: 18px; height: 18px; }
  .nav-ico {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    flex: 0 0 28px; color: #fff;
  }
  .nav-ico svg { width: 15px; height: 15px; stroke: #fff; }
  .nav-ico.solid svg { fill: #fff; stroke: none; }
  .nav-ico.blue { background: #3b82f6; }
  .nav-ico.violet { background: #8b5cf6; }
  .nav-ico.green { background: #10b981; }
  .nav-ico.sky { background: #0ea5e9; }
  .nav-ico.amber { background: #f59e0b; }
  .nav-ico.rose { background: #f43f5e; }
  .nav-ico.pink { background: #ec4899; }
  .nav-ico.teal { background: #14b8a6; }
  .nav-ico.indigo { background: #6366f1; }
  .nav .sec { margin: 14px 8px 6px; font-size: 11px; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; }
  .kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .ico-tile {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 36px;
  }
  .ico-tile.blue { background: var(--blue-soft); color: var(--blue-deep); }
  .ico-tile.green { background: var(--green-soft); color: #059669; }
  .ico-tile.rose { background: var(--rose-soft); color: var(--rose); }
  .ico-tile.violet { background: var(--violet-soft); color: #6d28d9; }
  .ico-tile.amber { background: var(--amber-soft); color: #d97706; }
  .btn { display: inline-flex; align-items: center; gap: 7px; }
  .act {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; min-width: 92px; padding: 8px 10px 9px;
    border: 1px solid var(--line); background: #fff; border-radius: 12px;
    color: #334155; font-size: 11.5px; line-height: 1.2;
  }
  .act:hover { border-color: #cbd5e1; background: #fafbff; }
  .act-ico {
    width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  }
  .act-ico svg { width: 16px; height: 16px; stroke: #fff; }
  .act-ico.solid svg { fill: #fff; stroke: none; }
  .act-ico.violet { background: #8b5cf6; }
  .act-ico.blue { background: #3b82f6; }
  .act-ico.green { background: #10b981; }
  .act-ico.amber { background: #f59e0b; }
  .act-ico.teal { background: #14b8a6; }
  .act-ico.indigo { background: #6366f1; }
  .act-ico.sky { background: #0ea5e9; }
  .act-ico.pink { background: #ec4899; }
  .act-ico.navy { background: #1e3a5f; }
  .act-ico.slate { background: #64748b; }
  .search .ico { color: #94a3b8; }
  .chip-user .ico { color: #94a3b8; width: 16px; height: 16px; }
  .chip-user .ico svg { width: 16px; height: 16px; }
  .h1-row { display: flex; align-items: center; gap: 10px; }
  .h1-row .ico-tile { width: 40px; height: 40px; border-radius: 12px; }
  .h1-row .ico-tile svg { width: 20px; height: 20px; }
  .page-head { margin: 0 0 14px; }
  .page-head.h1-row { justify-content: flex-start; }
  .page-head h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; line-height: 1.2; }
  .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .page-head .asof { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .page-head .btn.cmp {
    margin-left: auto; background: #C33D27; border-color: #C33D27; color: #fff;
    font-weight: 750; box-shadow: 0 8px 18px rgba(195,61,39,.28);
  }
  .page-head .btn.cmp:hover { background: #a83220; border-color: #a83220; }
  .card h2 .ico { color: var(--blue-deep); margin-right: 2px; }

  .main { min-width: 0; }
  .top {
    height: var(--top); background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 22px; position: sticky; top: 0; z-index: 5;
  }
  .search {
    flex: 1; max-width: 560px; display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
  }
  .search input { border: 0; background: transparent; outline: none; width: 100%; }
  .chip-user {
    margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px;
  }
  .dot { width: 28px; height: 28px; border-radius: 50%; background: #dbeafe; color: var(--blue-deep);
    display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .top-tools { display: flex; align-items: center; gap: 8px; }
  .bell, .lang-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 12px; color: #fff; border: 0; cursor: pointer;
    flex: 0 0 auto; box-shadow: 0 1px 2px rgba(15,23,42,.08);
  }
  .bell {
    position: relative; background: #EAB308; color: #BE123C;
  }
  .bell svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .bell .dot {
    position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; border-radius: 50%;
    background: #BE123C; border: 2px solid #EAB308; display: none;
  }
  .bell.has-alert .dot { display: block; }
  .bell-pop {
    display: none; position: absolute; right: 22px; top: 58px; width: 280px; z-index: 20;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 14px 16px;
  }
  .bell-pop.on { display: block; }
  .bell-pop strong { display: block; font-size: 13.5px; margin-bottom: 4px; }
  .bell-pop p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .lang-btn {
    background: #7C3AED; font-size: 13px; letter-spacing: .04em; gap: 0;
    flex-direction: column; line-height: 1.05; padding: 4px 0;
  }
  .lang-btn small { font-size: 9px; font-weight: 700; color: #EDE9FE; }
  .lang-btn b { font-size: 13px; font-weight: 800; }
  html[lang="zh-CN"] .lang-btn b { letter-spacing: 0; }

  .page { padding: 22px 24px 48px; }
  .head { display: flex; align-items: flex-start; justify-content: flex-start; gap: 8px; margin-bottom: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .act-ico.sky { background: #0ea5e9; }
  .act-ico.rose { background: #f43f5e; }
  .act-ico.pink { background: #ec4899; }
  .act-ico.slate { background: #64748b; }
  .act-ico.navy { background: #1d4ed8; }
  .btn {
    border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; color: #334155;
  }
  .btn:hover { border-color: #cbd5e1; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-deep); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .filters select, .period-btn {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 10px; color: #334155; font-size: 12px; max-width: 168px;
  }
  .period-wrap { position: relative; }
  .period-btn { min-width: 120px; text-align: left; }
  .period-menu {
    display: none; position: absolute; left: 0; top: calc(100% + 4px); z-index: 12;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); min-width: 128px; padding: 6px 0; overflow: visible;
  }
  .period-wrap.open .period-menu, .period-wrap:hover .period-menu { display: block; }
  .period-menu button, .period-sub button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 6px 12px; font-size: 12.5px; color: #0f172a;
  }
  .period-menu button:hover, .period-sub button:hover { background: #eff6ff; }
  .period-year { position: relative; }
  .period-sub {
    display: none; position: absolute; left: calc(100% + 2px); top: 0; z-index: 30;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); min-width: 112px; padding: 6px 0; overflow: visible;
  }
  .period-sub .period-sub { max-height: 320px; overflow: auto; }
  .period-year:hover .period-sub { display: block; }
  .period-sub .q { font-weight: 800; color: var(--blue-deep); border-top: 1px solid #f1f5f9; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpis.kpis-sm { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .kpis.kpis-sm .kpi {
    width: 188px; flex: 0 0 188px; min-height: 78px; padding: 11px 12px; border-radius: 14px;
  }
  .kpis.kpis-sm .kpi b { font-size: 22px; margin: 2px 0 0; }
  .kpi-ink {
    width: 188px; flex: 0 0 188px; min-height: 78px; padding: 11px 12px 11px 14px;
    border-radius: 14px; background: #fff; color: #0f172a;
    box-shadow: var(--shadow); border: 1px solid var(--line); border-left-width: 5px;
  }
  .kpi-ink.total { border-left-color: #6366f1; }
  .kpi-ink.fresh { border-left-color: #db2777; }
  .kpi-ink .lab { color: #64748b; font-size: 12px; font-weight: 700; }
  .kpi-ink b { display: block; font-size: 22px; letter-spacing: -.03em; margin: 2px 0 0; color: #0f172a; }
  .kpi-ink .delta { font-size: 11.5px; color: #64748b; }
  .kpi-ink .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .kpi-ink.total .ico-tile { background: #eef2ff; color: #4338ca; }
  .kpi-ink.fresh .ico-tile { background: #fce7f3; color: #be185d; }
  .cust-bento {
    display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; align-items: stretch;
  }
  .cust-bento .span2 { grid-column: 1 / -1; }
  .kpi {
    border-radius: 16px; padding: 14px 16px; min-height: 92px; color: #fff;
    box-shadow: 0 8px 20px rgba(15,23,42,.12);
  }
  .kpi.po { background: linear-gradient(160deg, #fb923c, #f97316); }
  .kpi.spend { background: linear-gradient(160deg, #60a5fa, #2563eb); }
  .kpi.late { background: linear-gradient(160deg, #fb7185, #e11d48); }
  .kpi.fty { background: linear-gradient(160deg, #34d399, #059669); }
  .kpi .lab { color: rgba(255,255,255,.82); font-size: 12px; }
  .kpi b { display: block; font-size: 26px; letter-spacing: -.03em; margin: 4px 0 2px; color: #fff; }
  .kpi .delta { font-size: 12px; color: rgba(255,255,255,.78); }
  .kpi .delta.up, .kpi .delta.down { color: #fff; }
  .kpi.click { cursor: pointer; }
  .kpi.click:hover { filter: brightness(1.06); }
  .kpi .ico-tile { background: rgba(255,255,255,.18); color: #fff; }
  .cust-bar { display: none; }
  .cc-strip {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch;
  }
  .cc-chip {
    display: flex; align-items: center; gap: 10px;
    background: #f8fafc; border: 1px solid #e8eef6; border-radius: 12px;
    padding: 10px 14px; flex: 1 1 240px; min-width: 0;
  }
  .cc-chip .flag { width: 22px; height: 22px; flex: 0 0 22px; }
  .cc-chip .who { min-width: 0; }
  .cc-chip .who .cc { font-weight: 800; font-size: 13px; line-height: 1.15; }
  .cc-chip .who .names { color: #64748b; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-chip b { font-size: 22px; letter-spacing: -.04em; margin-left: auto; font-variant-numeric: tabular-nums; }
  .cc-stat {
    min-width: 86px; border: 1px solid #e8eef6; border-radius: 12px;
    padding: 8px 14px; display: flex; flex-direction: column; justify-content: center;
  }
  .cc-stat small { font-size: 10.5px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
  .cc-stat b { font-size: 22px; letter-spacing: -.04em; line-height: 1.15; }
  .cc-stat .delta { font-size: 11px; color: #64748b; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bu-cat-row { display: grid; grid-template-columns: .78fr 1.42fr; gap: 14px; margin-bottom: 14px; align-items: stretch; }
  .bu-cat-row .bu-mosaic { grid-template-columns: 1fr 1fr; }
  .bu-cat-row .bu-mosaic .cell { min-height: 78px; }
  .bu-cat-row .cat-tree { min-height: 100%; }
  .bu-donut {
    display: grid; grid-template-columns: 1fr 118px; gap: 10px; align-items: center;
  }
  .bu-donut .ring { position: relative; width: 100%; max-width: 240px; margin: 0 auto; }
  .bu-donut .ring svg { width: 100%; height: auto; display: block; }
  .bu-donut .hole {
    position: absolute; inset: 28%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; pointer-events: none;
  }
  .bu-donut .hole b { font-size: 16px; letter-spacing: -.04em; line-height: 1.1; }
  .bu-donut .hole small { font-size: 10.5px; color: #64748b; font-weight: 700; }
  .bu-donut .leg { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .bu-donut .leg .row {
    display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center;
    font-size: 11.5px;
  }
  .bu-donut .leg i { width: 10px; height: 10px; border-radius: 50%; }
  .bu-donut .leg .lab { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bu-donut .leg .pct { color: #64748b; font-variant-numeric: tabular-nums; font-weight: 700; }
  @media (max-width: 640px) {
    .bu-donut { grid-template-columns: 1fr; }
    .bu-donut .leg { flex-direction: row; flex-wrap: wrap; }
    .bu-donut .leg .row { grid-template-columns: 10px auto auto; }
  }
  @media (max-width: 1100px) {
    .bu-cat-row { grid-template-columns: 1fr; }
    .bu-cat-row .bu-mosaic { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .bu-cat-row .bu-mosaic { grid-template-columns: 1fr 1fr; }
    .cc-stat { flex: 1 1 40%; }
  }
  .cmp-chip {
    border: 1px solid var(--line); background: #fff; color: #334155;
    border-radius: 999px; padding: 7px 14px; font-weight: 650; margin: 0 6px 6px 0;
  }
  .cmp-chip.on { background: var(--blue-soft); color: var(--blue-deep); border-color: #bfdbfe; }

  .layout { display: grid; grid-template-columns: 1.7fr .9fr; gap: 14px; align-items: stretch; }
  .layout > .card { min-height: 100%; }
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .card h2 {
    margin: 0; padding: 14px 16px 10px; font-size: 14.5px; display: flex; align-items: baseline; gap: 8px;
  }
  .card h2 span { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .card .pad { padding: 0 16px 16px; }
  .tabs { display: flex; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
  .tabs button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; color: #475569; font-size: 12px;
  }
  .tabs button.on { background: var(--blue-soft); border-color: #bfdbfe; color: var(--blue-deep); font-weight: 650; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; color: #94a3b8; font-weight: 600; padding: 8px 10px;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  .po { font-weight: 650; }
  .sub { color: var(--muted); font-size: 11.5px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px;
    border-radius: 999px; background: #f1f5f9; color: #475569; white-space: nowrap;
  }
  .tag.easy { background: var(--green-soft); color: #047857; }
  .tag.med { background: var(--amber-soft); color: #b45309; }
  .tag.hard { background: #ffedd5; color: #c2410c; }
  .tag.vhard { background: var(--rose-soft); color: #be123c; }
  .tag.blue { background: var(--blue-soft); color: var(--blue-deep); }
  .tag.violet { background: var(--violet-soft); color: #6d28d9; }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 14px; color: var(--muted); font-size: 12px; }
  .pager .pages { display: flex; gap: 4px; }
  .pager button { min-width: 28px; height: 28px; border: 1px solid var(--line); background: #fff; border-radius: 8px; }
  .pager button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: default; }

  .rail { display: flex; flex-direction: column; gap: 14px; }
  .donut-wrap { display: flex; align-items: center; gap: 14px; }
  .donut { position: relative; width: 210px; height: 210px; flex: 0 0 210px; }
  .donut svg { width: 210px; height: 210px; transform: rotate(-90deg); filter: drop-shadow(0 4px 8px rgba(15,23,42,.08)); }
  .legend i { width: 10px; height: 10px; box-shadow: 0 0 0 2px #fff inset; }
  .donut .mid {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; transform: none;
  }
  .donut .mid b { display: block; font-size: 30px; letter-spacing: -.03em; }
  .donut .mid span { color: var(--muted); font-size: 11px; }
  .legend { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .legend li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; color: #334155; }

      var id = o.ho ? String(o.ho) : ("NOHO|" + poKey(o));

    var keys = Object.keys(by).sort();
    if (!keys.length) return "";
    var C_ON = "#10b981", C_LATE = "#f43f5e", C_NONE = "#8b5cf6";

  function qualityPerfCard(rows) {
    var enM = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var zhM = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    var names = lang === "zh" ? zhM : enM;
    var year = "2026";
    var lateBy = {};
    rows.forEach(function (o) {
      if (!o.customerDue) return;
      var band = delayBand(o.customerDue);
      if (band.key === "easy" || band.key === "none") return;
      var mk = o.customerDue.slice(0, 7);
      if (!lateBy[mk]) lateBy[mk] = {};
      var id = o.ho ? String(o.ho) : ("NOHO|" + poKey(o));
      lateBy[mk][id] = true;
    });
    var seedC = [4, 3, 6, 2, 3, 4, 5, 7, 6, 2, 3, 5];
    var seedA = [1.2, 0.8, 1.6, 0.7, 0.9, 1.1, 1.4, 1.8, 1.5, 0.6, 0.9, 1.3];
    var pts = [];
    var max = 1;
    for (var i = 0; i < 12; i++) {
      var key = year + "-" + String(i + 1).padStart(2, "0");
      var late = lateBy[key] ? Object.keys(lateBy[key]).length : 0;
      var rec = { key: key, label: names[i], late: late, c: seedC[i], a: seedA[i] };
      pts.push(rec);
      if (late > max) max = late;
      if (rec.c > max) max = rec.c;
    }
    var w = 1100, h = 420, padL = 44, padR = 20, padT = 36, padB = 44;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var slot = innerW / 12;
    var barW = Math.min(48, slot * 0.55);
    var axis = "";
    for (var g = 0; g <= 4; g++) {
      var gy = padT + innerH * g / 4;
      var gv = Math.round(max * (1 - g / 4));
      axis += "<line x1='" + padL + "' y1='" + gy.toFixed(1) + "' x2='" + (w - padR) + "' y2='" + gy.toFixed(1) +
        "' stroke='#e8eef6'/><text x='" + (padL - 6) + "' y='" + (gy + 3).toFixed(1) +
        "' text-anchor='end' font-size='10' fill='#94a3b8'>" + gv + "</text>";
    }
    var bars = pts.map(function (p, i) {
      var x = padL + i * slot + (slot - barW) / 2;
      var bh = (p.c / max) * innerH;
      var y = padT + innerH - bh;
      var cx = x + barW / 2;
      return "<rect x='" + x.toFixed(1) + "' y='" + y.toFixed(1) + "' width='" + barW.toFixed(1) +
        "' height='" + Math.max(1, bh).toFixed(1) + "' rx='3' fill='#3b82f6' opacity='.85'></rect>" +
        (p.c ? "<text x='" + cx + "' y='" + (y - 6) + "' text-anchor='middle' font-size='13' font-weight='800' fill='#1d4ed8'>" + p.c + "</text>" : "") +
        "<text x='" + cx + "' y='" + (h - 14) + "' text-anchor='middle' font-size='13' font-weight='700' fill='#334155'>" + p.label + "</text>";
    }).join("");
    function lineOf(key, color, labelNums) {
      var coords = pts.map(function (p, i) {
        return { x: padL + i * slot + slot / 2, y: padT + innerH - (p[key] / max) * innerH, n: p[key] };
      });
      var d = coords.map(function (c, i) { return (i ? "L" : "M") + c.x.toFixed(1) + " " + c.y.toFixed(1); }).join(" ");
      var dots = coords.map(function (c, i) {
        var lab = labelNums && c.n ? ("<text x='" + c.x.toFixed(1) + "' y='" + (c.y - 12).toFixed(1) +
          "' text-anchor='middle' font-size='13' font-weight='800' fill='" + color + "'>" + c.n + "</text>") : "";
        return lab + "<circle cx='" + c.x.toFixed(1) + "' cy='" + c.y.toFixed(1) + "' r='5' fill='#fff' stroke='" + color + "' stroke-width='2.4'><title>" +
          esc(pts[i].label + " · " + pts[i][key]) + "</title></circle>";
      }).join("");
      return "<path d='" + d + "' fill='none' stroke='" + color + "' stroke-width='3' stroke-linejoin='round'/>" + dots;
    }
    return "<div class='card span-all'><h2>" + ico("quality") + " " + t("qualityPerf") +
      " <span>SAMPLE + late HO</span></h2><div class='pad'>" +
      "<p class='sub' style='margin:0 0 8px'>" + t("qpNote") + "</p>" +
      "<div class='qp-chart'><svg viewBox='0 0 " + w + " " + h + "'>" + axis + bars +
      lineOf("late", "#f43f5e", true) + lineOf("a", "#10b981", false) + "</svg></div>" +
      "<div class='dtime-leg'><span><b style='background:#3b82f6'></b>" + t("qpComplaints") + "</span>" +
      "<span><b style='background:#f43f5e'></b>" + t("qpLate") + "</span>" +
      "<span><b style='background:#10b981'></b>" + t("qpAvg") + "</span></div></div></div>";

  function hoMonthBlock(hoMonth, distinctHo) {
    var enM = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var zhM = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    var names = lang === "zh" ? zhM : enM;
    var year = "2026";
    var ftyKeys = {};
    var months = [];
    var max = 1;
    for (var i = 0; i < 12; i++) {
      var key = year + "-" + String(i + 1).padStart(2, "0");
      var rec = hoMonth[key];
      var ho = rec ? Object.keys(rec.hos).length : 0;
      months.push({ key: key, label: names[i], ho: ho, qty: rec ? rec.qty || 0 : 0, fty: rec ? (rec.fty || {}) : {} });
      if (ho > max) max = ho;
      if (rec && rec.fty) {
        Object.keys(rec.fty).forEach(function (k) { ftyKeys[k] = rec.fty[k].name || k; });
      }
    }
    var ftyList = Object.keys(ftyKeys).sort();
    var colorOf = ftyColorOf(ftyKeys);

    var slot = innerW / nM;
    var barW = Math.min(56, slot * 0.78);
    var tops = [];
    var bars = months.map(function (m, i) {
      var x = padL + i * slot + (slot - barW) / 2;
      var y = padT + innerH;
      var stack = "";
      ftyList.forEach(function (k) {
        var f = m.fty[k];
        var n = f ? Object.keys(f.hos).length : 0;

        var bh = (n / max) * innerH;
        y -= bh;

          "' height='" + Math.max(1.4, bh).toFixed(1) + "' rx='3' fill='" + colorOf[k] +
          "'></rect>" +
          (show ? "<text x='" + (x + barW / 2).toFixed(1) + "' y='" + midY.toFixed(1) +
            "' text-anchor='middle' font-size='12' font-weight='800' fill='#fff'>" + n + "</text>" : "") +
          "<title>" + esc(tip) + "</title></g>";
      });
      var cx = x + barW / 2;
      var topY = padT + innerH - (m.ho / max) * innerH;
      tops.push({ x: cx, y: topY });
      return stack +
        (m.ho ? "<text x='" + cx + "' y='" + (topY - 8) + "' text-anchor='middle' font-size='12' font-weight='800' fill='#0f172a'>" + m.ho + "</text>" : "") +
        "<text x='" + cx + "' y='" + (h - 12) + "' text-anchor='middle' font-size='12' font-weight='700' fill='#334155'>" + m.label + "</text>";
    }).join("");
    var line = "";

      var d = tops.map(function (p, i) { return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ");
      var last = tops[tops.length - 1];
      var prev = tops[tops.length - 2];
      var ang = Math.atan2(last.y - prev.y, last.x - prev.x);
      var ah = 8;
      var a1x = last.x - ah * Math.cos(ang - 0.5);
      var a1y = last.y - ah * Math.sin(ang - 0.5);
      var a2x = last.x - ah * Math.cos(ang + 0.5);

        " L" + a2x.toFixed(1) + " " + a2y.toFixed(1) + " Z' fill='#0f172a'/>";
    }
    var legend = "<div class='fty-legend'>" + ftyList.map(function (k) {
      return "<span><i style='background:" + colorOf[k] + "'></i>" + esc(ftyNick(k, ftyKeys[k])) + "</span>";
    }).join("") + "</div>";
    return "<div class='card'><h2>" + ico("trend") + " " + t("hoMonth") +
      " <span>" + fmt(distinctHo) + " HO</span></h2>" +
      "<div class='pad'><div class='ho-chart'><svg viewBox='0 0 " + w + " " + h + "'>" + bars + line +
      "</svg></div>" + legend +
      "<p class='sub' style='margin:8px 0 0'>Each colour = factory. Label = name + HO. Tap a slice for the HO list.</p></div></div>";
  }

      var da = a.customerDue || "9999", db = b.customerDue || "9999";
      return da < db ? -1 : da > db ? 1 : 0;
    });
    var pages = Math.max(1, Math.ceil(list.length / pageSize));

  function monthBars(parts) {
    var w = 640, h = 280, padL = 30, padR = 12, padT = 24, padB = 32;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var max = 1;
    parts.forEach(function (p) { if (p.n > max) max = p.n; });
    var n = Math.max(1, parts.length);
    var slot = innerW / n;
    var barW = Math.min(46, slot * 0.62);
    var pts = [];
    var bars = parts.map(function (p, i) {
      var bh = (p.n / max) * innerH;
      var x = padL + i * slot + (slot - barW) / 2;
      var y = padT + innerH - bh;
      var cx = x + barW / 2;
      pts.push(cx.toFixed(1) + "," + y.toFixed(1));
      return "<rect x='" + x.toFixed(1) + "' y='" + y.toFixed(1) + "' width='" + barW.toFixed(1) +
        "' height='" + Math.max(1, bh).toFixed(1) + "' rx='4' fill='" + (p.color || "#3b82f6") + "'></rect>" +
        "<text x='" + cx.toFixed(1) + "' y='" + (y - 6).toFixed(1) + "' text-anchor='middle' font-size='11' font-weight='800' fill='#0f172a'>" + p.n + "</text>" +
        "<text x='" + cx.toFixed(1) + "' y='" + (h - 10) + "' text-anchor='middle' font-size='10' font-weight='700' fill='#334155'>" + esc(p.label) + "</text>";
    }).join("");
    var line = "<polyline points='" + pts.join(" ") + "' fill='none' stroke='#f43f5e' stroke-width='2.5'></polyline>" +
      pts.map(function (pt) {
        var xy = pt.split(",");
        return "<circle cx='" + xy[0] + "' cy='" + xy[1] + "' r='3.5' fill='#fff' stroke='#f43f5e' stroke-width='2'></circle>";
      }).join("");
    return "<svg viewBox='0 0 " + w + " " + h + "' style='width:100%;height:auto'>" + bars + line + "</svg>";
  }

  function compareBuckets(rows, mode) {
    var seen = {};
    var map = {};
    rows.forEach(function (o) {
      var k = (o.po || "") + "|" + (o.factoryCode || o.sheet || "");
      if (!o.po || !o.customerDue || seen[k]) return;
      seen[k] = true;
      var d = new Date(o.customerDue + "T00:00:00");
      var key = "";
      if (mode === "week") {
        var one = new Date(d.getFullYear(), 0, 1);
        var wk = Math.ceil(((d - one) / 86400000 + one.getDay() + 1) / 7);
        key = d.getFullYear() + "-W" + (wk < 10 ? "0" + wk : wk);
      } else if (mode === "quarter") {
        key = d.getFullYear() + "-Q" + (Math.floor(d.getMonth() / 3) + 1);
      } else if (mode === "year") {
        key = String(d.getFullYear());
      } else {
        key = o.customerDue.slice(0, 7);
      }
      map[key] = (map[key] || 0) + 1;
    });
    var keys = Object.keys(map).sort();
    if (keys.length < 2) return "<p class='empty'>" + t("cmpNeed") + "</p>";
    var body = "";
    for (var i = 1; i < keys.length; i++) {
      var a = map[keys[i]], b = map[keys[i - 1]];
      var diff = a - b;
      var pct = b ? Math.round(100 * diff / b) : 0;
      var sign = diff > 0 ? "+" : "";
      body += "<tr><td>" + esc(keys[i]) + "</td><td class='num'>" + a + "</td><td>" + esc(keys[i - 1]) +
        "</td><td class='num'>" + b + "</td><td class='num' style='color:" + (diff < 0 ? "#e11d48" : "#16a34a") + "'>" +
        sign + diff + " · " + sign + pct + "%</td></tr>";
    }
    return "<table class='grid'><thead><tr><th>" + t("cmpA") + "</th><th class='num'>PO</th><th>" + t("cmpB") +
      "</th><th class='num'>PO</th><th class='num'>Δ</th></tr></thead><tbody>" + body + "</tbody></table>";
  }

  function paintAsiaMap(s) {
    var el = document.getElementById("asiaMap");
    if (!el) return;
    if (asiaMap) { asiaMap.remove(); asiaMap = null; }
    el.innerHTML = "";
    var colorOf = ftyColorOf(s.ftyMap);
    var ranked = Object.keys(s.ftyMap).sort(function (a, b) {
      return ftyHoN(s.ftyMap[b]) - ftyHoN(s.ftyMap[a]);
    });
    var maxHo = 1;
    ranked.forEach(function (k) { var n = ftyHoN(s.ftyMap[k]); if (n > maxHo) maxHo = n; });
    var rail = document.getElementById("ftyHoRail");
    if (rail) {
      rail.innerHTML = ranked.map(function (k) {
        var f = s.ftyMap[k];
        var n = ftyHoN(f);
        var w = Math.max(6, Math.round(100 * n / maxHo));
        var lab = (f.code || k) + " " + ftyNick(k, f.name);
        return "<div class='fty-ho-row'><div class='lab'><span>" + esc(lab) + "</span><b>" + n +
          "</b></div><div class='track'><i style='width:" + w + "%;background:" + colorOf[k] + "'></i></div></div>";
      }).join("");
    }
    if (!window.L) {
      el.innerHTML = "<p class='empty'>Map zoom needs vendor/leaflet.js next to this page.</p>";
      return;
    }
    var pins = [], unknown = [];
    Object.keys(s.ftyMap).forEach(function (k) {
      var f = s.ftyMap[k];
      f._key = k;
      if (f.lat != null && f.lon != null) pins.push(f);
      else unknown.push(f);
    });
    asiaMap = L.map(el, {
      zoomControl: true,
      scrollWheelZoom: true,
      attributionControl: false,
      minZoom: 4,
      maxZoom: 10
    }).setView([16.5, 106.5], 5.4);
    if (window.ASIA) {
      L.geoJSON(window.ASIA, {
        style: { color: "#334155", weight: 0.8, fillColor: "#1e293b", fillOpacity: 1 }
      }).addTo(asiaMap);
    }
    [
      { n: "China", lat: 36, lon: 103 },
      { n: "India", lat: 22, lon: 78 },
      { n: "Vietnam", lat: 15.5, lon: 109.5 },
      { n: "Thailand", lat: 16, lon: 101 },
      { n: "Cambodia", lat: 12.2, lon: 105 },
      { n: "Indonesia", lat: -2.5, lon: 113 },
      { n: "Philippines", lat: 12.5, lon: 122 },
      { n: "Malaysia", lat: 4, lon: 102 },
      { n: "Japan", lat: 37, lon: 138 },
      { n: "South Korea", lat: 36.5, lon: 128 },
      { n: "Bangladesh", lat: 24.2, lon: 90.2 },
      { n: "Myanmar", lat: 21, lon: 96 }
    ].forEach(function (l) {
      L.marker([l.lat, l.lon], {
        icon: L.divIcon({ className: "map-label", html: l.n, iconSize: [80, 14], iconAnchor: [40, 7] }),
        interactive: false
      }).addTo(asiaMap);
    });
    pins.forEach(function (f) {
      var col = colorOf[f._key] || "#7C3AED";
      var n = ftyHoN(f);
      var r = Math.max(7, Math.min(16, 6 + Math.sqrt(n)));
      L.circleMarker([f.lat, f.lon], {
        radius: r, color: "#0b1220", weight: 2, fillColor: col, fillOpacity: 0.95
      }).addTo(asiaMap).bindPopup(
        "<b>" + esc(f.code || "") + " · " + esc(f.name || "") + "</b><br>" +
        esc(f.province) + ", Vietnam<br>" + n + " HO · " + Object.keys(f.pos).length + " PO"
      );
      L.marker([f.lat, f.lon], {
        icon: L.divIcon({
          className: "map-pin",
          html: "<b>" + esc(f.code || "") + "</b><small>" + esc(ftyNick(f._key, f.name)) + "</small>",
          iconSize: [88, 28],
          iconAnchor: [44, -8]
        }),
        interactive: false
      }).addTo(asiaMap);
    });
    if (pins.length) {
      var b = L.latLngBounds(pins.map(function (f) { return [f.lat, f.lon]; }));
      asiaMap.fitBounds(b.pad(0.35));
    } else {
      asiaMap.fitBounds([[-8, 70], [50, 145]], { padding: [12, 12] });
    }
    var bits = ["Vietnam · " + pins.length + " factory"];
    var prov = {};
    pins.forEach(function (f) { if (f.province) prov[f.province] = (prov[f.province] || 0) + 1; });
    bits.push(Object.keys(prov).length + " provinces");
    if (unknown.length) bits.push(unknown.length + " factory not pinned");
    var leg = document.getElementById("asiaMapLegend");
    if (leg) leg.textContent = bits.join(" · ") + " · bar = HO · pin colour = factory";
    setTimeout(function () { if (asiaMap) asiaMap.invalidateSize(); }, 80);
  }

  function pageHead() {
    var titles = (I18N[lang] && I18N[lang].titles) || I18N.en.titles;
    var pack = titles[view] || titles.dash || [view, ""];
    var icoName = PATHS[view] ? view : "dash";
    var tint = view === "costing" ? "green" : view === "designer" ? "violet" : view === "quality" ? "green" : view === "factories" ? "amber" : view === "customers" ? "rose" : "blue";
    var sub = pack[1] ? "<p>" + esc(pack[1]) + "</p>" : "";
    var asof = view === "customers"
      ? "<button type='button' class='btn cmp' id='cmpBtn'>" + t("cmpBtn") + "</button>"
      : "<span class='asof'>" + t("asOf") + " " + AS + "</span>";
    return "<div class='page-head h1-row'>" + tile(icoName, tint) +
      "<div><h1>" + esc(pack[0]) + "</h1>" + sub + "</div>" + asof + "</div>";
  }

  function sampleDesk(kind) {
    var titles = (I18N[lang] && I18N[lang].titles) || I18N.en.titles;
    var pack = titles[kind] || [kind, ""];
    var note = t(kind === "designer" ? "designerNote" : "costingNote");
    return "<div class='card'><h2>" + ico(kind) + " " + esc(pack[0]) +
      " <span>SAMPLE</span></h2><div class='pad'><p class='sub' style='margin:0 0 10px'>" +
      esc(pack[1]) + "</p><p class='empty' style='padding:12px 0'>" + esc(note) + "</p></div></div>";
  }

  function factoriesView(rows, s) {
    return "<div class='fty-dash'>" +
        purchaseLine(s.hoMonth) +
        deliveryTimeCard(rows) +
        defectSampleCard(s.ftyMap) +
        qualityPerfCard(rows) +
        asiaMapHtml("span-all") +
      "</div>";
  }

  function merchDesk(rows, s) {
    var blocks = Object.keys(s.ftyMap).sort().map(function (k) {
      var f = s.ftyMap[k];
      var nPo = Object.keys(f.pos).length;
      var nLate = Object.keys(f.late).length;
      var cats = Object.keys(f.cats).join(" · ") || "–";
      return "<div class='factory-row click' data-fty='" + encodeURIComponent(k) + "'><div><strong>" +
        esc(f.code || k) + " · " + esc(f.name || "") + "</strong><div class='sub'>" +
        esc(f.province ? f.province + ", Vietnam" : f.country) + " · " + esc(cats) + "</div></div>" +
        "<div class='sub' style='text-align:right'>" + nLate + " / " + nPo + " late PO · " + fmt(f.qty) + " pcs</div></div>";
    }).join("");
    return kpiRow(s) + "<div class='card'><h2>" + ico("factories") + " " + t("factoryMaster") +
      "</h2><div class='pad'>" + blocks + "</div></div>";
  }

  function customersView(rows, s) {
    return merch(rows, s);
  }

  var painted = false;
  function setView(name) {
    if (painted && name === view) {
      document.querySelectorAll(".nav button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-view") === name);
      });
      return;
    }
    painted = true;
    view = name;
    page = 1;
    if (name !== "quality") tableTab = "all";
    document.querySelectorAll(".nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === name);
    });
    render();
  }

  function render() {
    var rows = filtered();
    var s = stats(rows);
    var html = "";
    if (view === "dash") html = dash(rows, s);
    else if (view === "merch") html = merchDesk(rows, s);
    else if (view === "costing") html = sampleDesk("costing");
    else if (view === "designer") html = sampleDesk("designer");
    else if (view === "quality") html = quality(rows, s);
    else if (view === "orders") html = kpiRow(s) + tableCard(rows, s, "page");
    else if (view === "factories") html = factoriesView(rows, s);
    else html = customersView(rows, s);
    document.getElementById("view").innerHTML = pageHead() + html;
    if (document.getElementById("asiaMap")) paintAsiaMap(s);
    if (keepBook) {
      var book = document.getElementById("orderBook");
      if (book && book.scrollIntoView) book.scrollIntoView({ block: "start" });
      keepBook = false;
    }
  }

  var appEl = document.getElementById("app");
  function closeNav() { appEl.classList.remove("nav-open"); }
  document.getElementById("menuBtn").addEventListener("click", function () {
    appEl.classList.toggle("nav-open");
  });
  document.getElementById("scrim").addEventListener("click", closeNav);
  document.querySelectorAll(".nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      setView(b.getAttribute("data-view"));
      closeNav();
    });
  });
  function clearFilters() {
    ftySel.value = "";
    custSel.value = "";
    catSel.value = "";
    document.getElementById("fDue").value = "all";
    document.getElementById("fKind").value = "";
    document.getElementById("q").value = "";
    locVal = "";
    locBtn.textContent = t("allLocations");
    locWrap.classList.remove("open");
    periodVal = "";
    periodBtn.textContent = t("allPeriods");
    periodWrap.classList.remove("open");
    tableTab = "all";
    page = 1;
    keepBook = false;
    closeDelayPop();
  }
  document.getElementById("btnHome").addEventListener("click", function () {
    clearFilters();
    setView("dash");
  });
  document.querySelectorAll("[data-jump]").forEach(function (b) {
    b.addEventListener("click", function () { setView(b.getAttribute("data-jump")); });
  });
  document.getElementById("btnMap").addEventListener("click", function () {
    setView("dash");
    setTimeout(function () {
      var m = document.getElementById("asiaMap");
      if (m) m.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 80);
  });
  ["fFty", "fCust", "fCat", "fDue", "fKind"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", function () { page = 1; render(); });
  });
  document.getElementById("q").addEventListener("input", function () { page = 1; render(); });
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  document.getElementById("view").addEventListener("click", function (e) {
    var img = e.target.closest && e.target.closest("img.thumb");
    if (img && img.getAttribute("data-full")) {
      lightboxImg.src = img.getAttribute("data-full");
      lightbox.classList.add("on");
      return;
    }
    var kpiEl = e.target.closest("[data-kpi]");
    if (kpiEl) { openKpiPop(kpiEl.getAttribute("data-kpi")); return; }
    if (e.target.closest("#cmpBtn")) { openCompare(); return; }
    var bandEl = e.target.closest("[data-band]");
    if (bandEl) { openDelayPop(bandEl.getAttribute("data-band")); return; }
    var custEl = e.target.closest("[data-cust]");
    if (custEl) {
      try { openCustPop(decodeURIComponent(custEl.getAttribute("data-cust"))); }
      catch (err) { openCustPop(custEl.getAttribute("data-cust")); }
      return;
    }
    var ftyEl = e.target.closest ? e.target.closest("[data-fty]") : null;
    if (!ftyEl) {
      var n = e.target;
      while (n && n !== e.currentTarget) {
        if (n.getAttribute && n.getAttribute("data-fty")) { ftyEl = n; break; }
        n = n.parentNode;
      }
    }
    var dt = e.target.closest ? e.target.closest("[data-dtime]") : null;
    if (dt && dt.getAttribute("data-fty")) {
      var fkDt;
      try { fkDt = decodeURIComponent(dt.getAttribute("data-fty")); }
      catch (err) { fkDt = dt.getAttribute("data-fty"); }
      var kind = dt.getAttribute("data-dtime");
      var listDt = filtered().filter(function (o) {
        if ((o.factoryCode || o.sheet) !== fkDt) return false;
        var b = delayBand(o.customerDue).key;
        if (kind === "on") return b === "easy";
        if (kind === "none") return b === "none";
        return b !== "easy" && b !== "none";
      });
      var labDt = fkDt + " · " + (kind === "on" ? t("dOnTime") : kind === "none" ? t("dNoDue") : t("dLate"));
      renderHoPop(labDt, listDt, "Customer due vs " + AS + ". No ship-early date in tracking.");
      return;
    }
    if (ftyEl && ftyEl.getAttribute("data-month")) {
      var mk = ftyEl.getAttribute("data-month");
      var fk;
      try { fk = decodeURIComponent(ftyEl.getAttribute("data-fty")); }
      catch (err) { fk = ftyEl.getAttribute("data-fty"); }
      var list = filtered().filter(function (o) {
        return (o.factoryCode || o.sheet) === fk && o.customerDue && o.customerDue.slice(0, 7) === mk;
      });
      var lab = mk.slice(5) + " · " + fk;
      renderHoPop(lab, list);
      return;
    }
    if (ftyEl) {
      try { openFtyPop(decodeURIComponent(ftyEl.getAttribute("data-fty"))); }
      catch (err) { openFtyPop(ftyEl.getAttribute("data-fty")); }
      return;
    }
    var pm = e.target.closest ? e.target.closest("[data-purchase-month]") : null;
    if (!pm) {
      var n2 = e.target;
      while (n2 && n2 !== e.currentTarget) {
        if (n2.getAttribute && n2.getAttribute("data-purchase-month")) { pm = n2; break; }
        n2 = n2.parentNode;
      }
    }
    if (pm) {
      var mk2 = pm.getAttribute("data-purchase-month");
      var list2 = filtered().filter(function (o) {
        return o.customerDue && o.customerDue.slice(0, 7) === mk2;
      });
      renderHoPop("Monthly Purchase Value · " + mk2, list2, "$ not reported — HO count for this order month.");
      return;
    }
    var t = e.target.closest("[data-tab]");
    if (t) { tableTab = t.getAttribute("data-tab"); page = 1; keepBook = true; render(); return; }
    var p = e.target.closest("[data-page]");
    if (p) {
      e.preventDefault();
      var n = +p.getAttribute("data-page");
      if (n && n !== page) { page = n; keepBook = true; render(); }
    }
  });
  var delayPop = document.getElementById("delayPop");
  function closeDelayPop() { delayPop.classList.remove("on"); resetPopStack(); }
  document.getElementById("delayPopX").addEventListener("click", closeDelayPop);
  document.getElementById("popBack").addEventListener("click", function (e) {
    e.stopPropagation();
    if (popStack.length) popPop();
    else closeDelayPop();
  });
  delayPop.addEventListener("click", function (e) {
    if (e.target === delayPop) closeDelayPop();
  });
  document.getElementById("delayPopCard").addEventListener("click", function (e) {
    var img = e.target.closest && e.target.closest("img.thumb");
    if (img && img.getAttribute("data-full")) {
      lightboxImg.src = img.getAttribute("data-full");
      lightbox.classList.add("on");
      e.stopPropagation();
      return;
    }
    var kf = e.target.closest("[data-kpi-fty]");
    if (kf) {
      var code;
      try { code = decodeURIComponent(kf.getAttribute("data-kpi-fty")); }
      catch (err) { code = kf.getAttribute("data-kpi-fty"); }
      pushPop(function () { openKpiPop("fty", true); });
      openFtyPop(code);
      e.stopPropagation();
      return;
    }
    var kc = e.target.closest("[data-kpi-cat]");
    if (kc) {
      var cat;
      try { cat = decodeURIComponent(kc.getAttribute("data-kpi-cat")); }
      catch (err) { cat = kc.getAttribute("data-kpi-cat"); }
      pushPop(function () { openKpiPop("cat", true); });
      renderHoPop(shortCat(cat), filtered().filter(function (o) { return o.category === cat; }), cat + " · tracking 9-24.");
      e.stopPropagation();
      return;
    }
    e.stopPropagation();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (popStack.length) popPop();
      else closeDelayPop();
    }
  });
  document.getElementById("langBtn").addEventListener("click", function () {
    setLang(lang === "zh" ? "en" : "zh");
  });
  document.getElementById("bellBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("bellPop").classList.toggle("on");
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#bellPop") && !e.target.closest("#bellBtn")) {
      document.getElementById("bellPop").classList.remove("on");
    }
  });
  lightbox.addEventListener("click", function () {
    lightbox.classList.remove("on");
    lightboxImg.src = "";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      lightbox.classList.remove("on");
      lightboxImg.src = "";
    }
  });
  applyChrome();
  var excelJsReady = null;
  function loadExcelJs() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (excelJsReady) return excelJsReady;
    excelJsReady = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = "vendor/exceljs.min.js";
      s.onload = function () {
        if (window.ExcelJS) resolve(window.ExcelJS);
        else reject(new Error("ExcelJS missing"));
      };
      s.onerror = function () { reject(new Error("ExcelJS load failed")); };
      document.head.appendChild(s);
    });
    return excelJsReady;
  }
  function fetchHoBuf(rel, cache) {
    if (cache[rel]) return cache[rel];
    cache[rel] = fetch(rel).then(function (res) {
      if (!res.ok) return null;
      return res.arrayBuffer();
    }).catch(function () { return null; });
    return cache[rel];
  }
  document.getElementById("btnExport").addEventListener("click", function () {
    var btn = document.getElementById("btnExport");
    var rows = filtered();
    if (!rows.length) return;
    btn.disabled = true;
    loadExcelJs().then(function (ExcelJS) {
      var wb = new ExcelJS.Workbook();
      var ws = wb.addWorksheet("Tracking", { views: [{ state: "frozen", ySplit: 1 }] });
      ws.columns = [
        { header: "Photo", key: "pic", width: 14 },
        { header: "HO", key: "ho", width: 14 },
        { header: "PO", key: "po", width: 16 },
        { header: "Factory", key: "factoryName", width: 28 },
        { header: "Code", key: "factoryCode", width: 10 },
        { header: "Customer", key: "customer", width: 16 },
        { header: "End customer", key: "endCustomer", width: 16 },
        { header: "Category", key: "category", width: 22 },
        { header: "Item", key: "item", width: 28 },
        { header: "Qty", key: "qty", width: 10 },
        { header: "Amount", key: "amount", width: 12 },
        { header: "Order date", key: "orderDate", width: 12 },
        { header: "Customer due", key: "customerDue", width: 14 },
        { header: "Factory due", key: "factoryDue", width: 14 },
        { header: "Order type", key: "orderCategory", width: 14 },
        { header: "QA", key: "qa", width: 12 },
        { header: "Inspect", key: "inspect", width: 14 }
      ];
      ws.getRow(1).font = { bold: true };
      var cache = {};
      var jobs = [];
      rows.forEach(function (o, i) {
        var r = i + 2;
        var row = ws.getRow(r);
        row.height = 52;
        row.values = [
          "",
          o.ho || "",
          o.po || "",
          o.factoryName || "",
          o.factoryCode || "",
          o.customer || "",
          o.endCustomer || "",
          o.category || "",
          o.item || o.productName || "",
          o.qty == null ? "" : o.qty,
          o.amount == null ? "" : o.amount,
          o.orderDate || "",
          o.customerDue || "",
          o.factoryDue || "",
          o.orderCategory || "",
          o.qa || "",
          o.inspect || ""
        ];
        var pic = o.ho && HO_IMAGES[o.ho] ? HO_IMAGES[o.ho] : "";
        if (!pic) return;
        jobs.push(fetchHoBuf(pic, cache).then(function (buf) {
          if (!buf) return;
          var imgId = wb.addImage({ buffer: buf, extension: "jpeg" });
          ws.addImage(imgId, { tl: { col: 0, row: r - 1 }, ext: { width: 72, height: 72 } });
        }));
      });
      return Promise.all(jobs).then(function () { return wb.xlsx.writeBuffer(); });
    }).then(function (buf) {
      var blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "supplier-benchmark-9-24.xlsx";
      a.click();
    }).catch(function () {
      alert("Excel export failed. Stay on this page and try again.");
    }).then(function () { btn.disabled = false; });
  });

  setView("dash");
})();
</script>
